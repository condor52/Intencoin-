<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>INTENCOIN Dashboard</title>
  <style>
    body {font-family: system-ui, sans-serif; background:#0f1220; color:#fff; margin:0; padding:20px;}
    header {display:flex;align-items:center;gap:12px;}
    h1 {color:#00ffff;}
    button {background:#151a38;border:1px solid #2a3a60;border-radius:10px;color:#fff;padding:10px 20px;cursor:pointer;}
    button:hover {background:#1d2450;}
  </style>
</head>
<body>
  <header>
    <img src="/static/logo-placeholder.png" width="64" height="64" alt="Logo">
    <h1>Welcome to INTENCOIN Cryptocurrency Dashboard</h1>
  </header>
  <p>This dashboard allows you to manage your INTENCOIN account.</p>

  <div>
    <button>Send</button>
    <button>Receive</button>
    <button>Withdraw</button>
  </div>

  <p style="margin-top:20px;">Your balance and wallets will appear here after login.</p>
</body>
</html>
